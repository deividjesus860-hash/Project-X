<script>

/* =====================================================
   PROJECT X INTELLIGENCE CORE
   PHASE 1
   ===================================================== */


/* =====================================================
   COMMAND MEMORY
   ===================================================== */

let commandHistory =
JSON.parse(
    localStorage.getItem(
        "projectXCommandHistory"
    )
) || [];


let customCommands =
JSON.parse(
    localStorage.getItem(
        "projectXCustomCommands"
    )
) || [];


/* =====================================================
   SAVE INTELLIGENCE DATA
   ===================================================== */

function saveCommandData(){

    localStorage.setItem(
        "projectXCommandHistory",
        JSON.stringify(
            commandHistory
        )
    );


    localStorage.setItem(
        "projectXCustomCommands",
        JSON.stringify(
            customCommands
        )
    );

}


/* =====================================================
   KEYBOARD
   ===================================================== */

function handleCommandKey(event){

    if(event.key==="Enter"){

        executeCommand();

    }

}


/* =====================================================
   QUICK COMMAND
   ===================================================== */

function quickCommand(command){

    const input =
        document.getElementById(
            "commandInput"
        );


    input.value=command;

    executeCommand();

}


/* =====================================================
   COMMAND EXECUTOR
   ===================================================== */

function executeCommand(){

    const input =
        document.getElementById(
            "commandInput"
        );


    const raw =
        input.value.trim();


    if(!raw)
        return;


    addCommandMessage(
        raw,
        "user"
    );


    saveCommandHistory(raw);


    input.value="";


    setTimeout(
        () => {

            const response =
                interpretCommand(raw);


            addCommandMessage(
                response,
                "system"
            );

        },
        120
    );

}


/* =====================================================
   INTERPRETER
   ===================================================== */

function interpretCommand(raw){

    const command =
        normalizeCommand(raw);


    /* -----------------------------------------------
       HELP
       ----------------------------------------------- */

    if(
        command==="ajuda" ||
        command==="help" ||
        command==="comandos"
    ){

        return `
<strong>COMANDOS DISPONÍVEIS</strong>

<div class="command-result">

<div class="command-result-title">
SISTEMA
</div>

<div class="command-result-line">
<strong>ajuda</strong> — mostra esta central de ajuda
</div>

<div class="command-result-line">
<strong>status</strong> — mostra o estado do Project X
</div>

<div class="command-result-line">
<strong>nivel</strong> — mostra seu nível e XP
</div>

<div class="command-result-line">
<strong>atividade</strong> — mostra atividades recentes
</div>

<div class="command-result-line">
<strong>historico</strong> — mostra comandos anteriores
</div>

</div>


<div class="command-result">

<div class="command-result-title">
PROJETOS
</div>

<div class="command-result-line">
<strong>projetos</strong> — lista projetos
</div>

<div class="command-result-line">
<strong>projetos ativos</strong> — mostra projetos em desenvolvimento
</div>

<div class="command-result-line">
<strong>projetos concluídos</strong> — mostra projetos concluídos
</div>

<div class="command-result-line">
<strong>criar projeto [nome]</strong> — cria um projeto
</div>

</div>


<div class="command-result">

<div class="command-result-title">
DADOS
</div>

<div class="command-result-line">
<strong>ideias</strong> — mostra quantidade de ideias
</div>

<div class="command-result-line">
<strong>metas</strong> — mostra suas metas
</div>

<div class="command-result-line">
<strong>tarefas</strong> — mostra suas tarefas
</div>

<div class="command-result-line">
<strong>estatisticas</strong> — mostra estatísticas gerais
</div>

</div>


<div class="command-result">

<div class="command-result-title">
AÇÕES
</div>

<div class="command-result-line">
<strong>criar ideia [texto]</strong>
</div>

<div class="command-result-line">
<strong>criar meta [nome]</strong>
</div>

<div class="command-result-line">
<strong>tema claro</strong>
</div>

<div class="command-result-line">
<strong>tema escuro</strong>
</div>

<div class="command-result-line">
<strong>limpar histórico</strong>
</div>

</div>
`;

    }


    /* -----------------------------------------------
       STATUS
       ----------------------------------------------- */

    if(
        command==="status" ||
        command==="estado" ||
        command==="sistema"
    ){

        const level =
            getSystemLevel();


        const active =
            projects.filter(
                p =>
                p.status===
                "Em desenvolvimento"
            ).length;


        const completed =
            projects.filter(
                p =>
                p.status===
                "Concluído"
            ).length;


        let tasks=0;

        let done=0;


        projects.forEach(p=>{

            tasks +=
                p.tasks.length;

            done +=
                p.tasks.filter(
                    t=>t.done
                ).length;

        });


        return `
<strong>SISTEMA ONLINE</strong>

<div class="command-result">

<div class="command-result-title">
PROJECT X STATUS
</div>

<div class="command-result-line">
Sistema: <span class="command-highlight">ONLINE</span>
</div>

<div class="command-result-line">
Projetos: <span class="command-highlight">${projects.length}</span>
</div>

<div class="command-result-line">
Projetos ativos: <span class="command-highlight">${active}</span>
</div>

<div class="command-result-line">
Projetos concluídos: <span class="command-highlight">${completed}</span>
</div>

<div class="command-result-line">
Tarefas: <span class="command-highlight">${done}/${tasks}</span>
</div>

<div class="command-result-line">
Ideias: <span class="command-highlight">${ideas.length}</span>
</div>

<div class="command-result-line">
Metas: <span class="command-highlight">${goals.length}</span>
</div>

<div class="command-result-line">
Nível: <span class="command-highlight">LV.${level.level}</span>
</div>

<div class="command-result-line">
XP: <span class="command-highlight">${level.points}</span>
</div>

</div>
`;

    }


    /* -----------------------------------------------
       PROJECTS
       ----------------------------------------------- */

    if(
        command==="projetos" ||
        command==="listar projetos"
    ){

        return listProjects(
            projects
        );

    }


    if(
        command==="projetos ativos" ||
        command==="ativos"
    ){

        return listProjects(
            projects.filter(
                p =>
                p.status===
                "Em desenvolvimento"
            )
        );

    }


    if(
        command==="projetos concluídos" ||
        command==="projetos concluidos" ||
        command==="concluídos" ||
        command==="concluidos"
    ){

        return listProjects(
            projects.filter(
                p =>
                p.status===
                "Concluído"
            )
        );

    }


    /* -----------------------------------------------
       IDEAS
       ----------------------------------------------- */

    if(
        command==="ideias" ||
        command==="listar ideias"
    ){

        if(!ideas.length){

            return `
<div class="command-result">
<div class="command-result-title">
IDEIAS
</div>

<div class="command-result-line">
Nenhuma ideia registrada.
</div>
</div>
`;

        }


        const recentIdeas =
            ideas.slice(0,8);


        return `
<div class="command-result">

<div class="command-result-title">
BANCO DE IDEIAS — ${ideas.length}
</div>

${recentIdeas.map(
    (idea,index)=>
`
<div class="command-result-line">
${index+1}. ${escapeHTML(
    idea.text
)}
</div>
`
).join("")}

</div>
`;

    }


    /* -----------------------------------------------
       GOALS
       ----------------------------------------------- */

    if(
        command==="metas" ||
        command==="listar metas"
    ){

        if(!goals.length){

            return `
<div class="command-result">

<div class="command-result-title">
METAS
</div>

<div class="command-result-line">
Nenhuma meta criada.
</div>

</div>
`;

        }


        return `
<div class="command-result">

<div class="command-result-title">
METAS — ${goals.length}
</div>

${goals.map(
    goal =>
`
<div class="command-result-line">

${escapeHTML(
    goal.title
)}

—

<span class="command-highlight">
${goal.progress}%
</span>

</div>
`
).join("")}

</div>
`;

    }


    /* -----------------------------------------------
       TASKS
       ----------------------------------------------- */

    if(
        command==="tarefas" ||
        command==="listar tarefas"
    ){

        let allTasks=[];


        projects.forEach(
            p => {

                p.tasks.forEach(
                    task => {

                        allTasks.push({

                            project:p.name,

                            ...task

                        });

                    }
                );

            }
        );


        if(!allTasks.length){

            return `
<div class="command-result">

<div class="command-result-title">
TAREFAS
</div>

<div class="command-result-line">
Nenhuma tarefa cadastrada.
</div>

</div>
`;

        }


        const pending =
            allTasks.filter(
                task =>
                !task.done
            );


        const completed =
            allTasks.filter(
                task =>
                task.done
            );


        return `
<div class="command-result">

<div class="command-result-title">
TAREFAS
</div>

<div class="command-result-line">
Total:
<span class="command-highlight">
${allTasks.length}
</span>
</div>

<div class="command-result-line">
Pendentes:
<span class="command-warning">
${pending.length}
</span>
</div>

<div class="command-result-line">
Concluídas:
<span class="command-highlight">
${completed.length}
</span>
</div>

</div>
`;

    }


    /* -----------------------------------------------
       STATISTICS
       ----------------------------------------------- */

    if(
        command==="estatisticas" ||
        command==="estatística" ||
        command==="estatistica" ||
        command==="stats"
    ){

        let tasks=0;

        let done=0;


        projects.forEach(p=>{

            tasks +=
                p.tasks.length;

            done +=
                p.tasks.filter(
                    t=>t.done
                ).length;

        });


        const average =
            projects.length
            ?
            Math.round(
                projects.reduce(
                    (sum,p)=>
                    sum+
                    calculateProgress(p),
                    0
                )
                /
                projects.length
            )
            :
            0;


        return `
<div class="command-result">

<div class="command-result-title">
ESTATÍSTICAS GERAIS
</div>

<div class="command-result-line">
Projetos: ${projects.length}
</div>

<div class="command-result-line">
Progresso médio: <span class="command-highlight">${average}%</span>
</div>

<div class="command-result-line">
Tarefas: ${tasks}
</div>

<div class="command-result-line">
Tarefas concluídas: <span class="command-highlight">${done}</span>
</div>

<div class="command-result-line">
Ideias: ${ideas.length}
</div>

<div class="command-result-line">
Metas: ${goals.length}
</div>

</div>
`;

    }


    /* -----------------------------------------------
       LEVEL
       ----------------------------------------------- */

    if(
        command==="nivel" ||
        command==="nível" ||
        command==="xp"
    ){

        const data =
            getSystemLevel();


        const progress =
            Math.min(
                100,
                Math.round(
                    (
                        data.points -
                        (data.level-1)*50
                    )
                    /
                    50*100
                )
            );


        return `
<div class="command-result">

<div class="command-result-title">
SYSTEM LEVEL
</div>

<div class="command-result-line">

Nível:
<span class="command-highlight">
LV.${data.level}
</span>

</div>

<div class="command-result-line">

XP:
<span class="command-highlight">
${data.points}
</span>

</div>

<div class="command-result-line">

Progresso:
<span class="command-highlight">
${progress}%
</span>

</div>

</div>
`;

    }


    /* -----------------------------------------------
       ACTIVITY
       ----------------------------------------------- */

    if(
        command==="atividade" ||
        command==="atividades" ||
        command==="histórico de atividade"
    ){

        if(!timeline.length){

            return `
<div class="command-result">

<div class="command-result-title">
ATIVIDADE
</div>

<div class="command-result-line">
Nenhuma atividade registrada.
</div>

</div>
`;

        }


        return `
<div class="command-result">

<div class="command-result-title">
ATIVIDADE RECENTE
</div>

${timeline.slice(0,8).map(
    item =>
`
<div class="command-result-line">

${escapeHTML(item.text)}

<br>

<small>
${escapeHTML(item.date)}
</small>

</div>
`
).join("")}

</div>
`;

    }


    /* -----------------------------------------------
       COMMAND HISTORY
       ----------------------------------------------- */

    if(
        command==="historico" ||
        command==="histórico"
    ){

        if(!commandHistory.length){

            return `
<div class="command-result">

<div class="command-result-title">
HISTÓRICO
</div>

<div class="command-result-line">
Nenhum comando executado.
</div>

</div>
`;

        }


        return `
<div class="command-result">

<div class="command-result-title">
ÚLTIMOS COMANDOS
</div>

${commandHistory.slice(0,10).map(
    item =>
`
<div class="command-result-line">

&gt; ${escapeHTML(
    item.command
)}

</div>
`
).join("")}

</div>
`;

    }


    /* -----------------------------------------------
       CREATE PROJECT
       ----------------------------------------------- */

    if(
        command.startsWith(
            "criar projeto "
        )
    ){

        const projectName =
            raw.substring(
                raw.toLowerCase()
                .indexOf(
                    "criar projeto "
                )
                +
                "criar projeto ".length
            )
            .trim();


        if(!projectName){

            return `
<span class="command-error">
Informe o nome do projeto.
</span>
`;

        }


        const project={

            name:
                projectName,

            description:
                "Projeto criado pela Central de Comandos.",

            status:
                "Ideia",

            priority:
                "Média",

            category:
                "Tecnologia",

            deadline:
                "",

            objective:
                "",

            tasks:
                [],

            notes:
                []

        };


        projects.push(
            project
        );


        addTimeline(
            "Projeto criado por comando: "+
            projectName
        );


        saveAll();

        renderAll();


        return `
<div class="command-result">

<div class="command-result-title">
PROJETO CRIADO
</div>

<div class="command-result-line">

<span class="command-highlight">
${escapeHTML(projectName)}
</span>

foi adicionado ao Project X.

</div>

<div class="command-result-line">
Status: Ideia
</div>

<div class="command-result-line">
Categoria: Tecnologia
</div>

</div>
`;

    }


    /* -----------------------------------------------
       CREATE IDEA
       ----------------------------------------------- */

    if(
        command.startsWith(
            "criar ideia "
        )
    ){

        const ideaText =
            raw.substring(
                raw.toLowerCase()
                .indexOf(
                    "criar ideia "
                )
                +
                "criar ideia ".length
            )
            .trim();


        if(!ideaText){

            return `
<span class="command-error">
Informe o texto da ideia.
</span>
`;

        }


        ideas.unshift({

            text:
                ideaText,

            date:
                new Date()
                .toLocaleString(
                    "pt-BR"
                )

        });


        addTimeline(
            "Ideia criada por comando"
        );


        saveAll();

        renderAll();


        return `
<div class="command-result">

<div class="command-result-title">
IDEIA REGISTRADA
</div>

<div class="command-result-line">

<span class="command-highlight">
${escapeHTML(ideaText)}
</span>

</div>

</div>
`;

    }


    /* -----------------------------------------------
       CREATE GOAL
       ----------------------------------------------- */

    if(
        command.startsWith(
            "criar meta "
        )
    ){

        const goalName =
            raw.substring(
                raw.toLowerCase()
                .indexOf(
                    "criar meta "
                )
                +
                "criar meta ".length
            )
            .trim();


        if(!goalName){

            return `
<span class="command-error">
Informe o nome da meta.
</span>
`;

        }


        goals.push({

            title:
                goalName,

            progress:
                0

        });


        addTimeline(
            "Meta criada por comando: "+
            goalName
        );


        saveAll();

        renderAll();


        return `
<div class="command-result">

<div class="command-result-title">
META CRIADA
</div>

<div class="command-result-line">

<span class="command-highlight">
${escapeHTML(goalName)}
</span>

</div>

<div class="command-result-line">
Progresso inicial: 0%
</div>

</div>
`;

    }


    /* -----------------------------------------------
       DARK THEME
       ----------------------------------------------- */

    if(
        command==="tema escuro" ||
        command==="modo escuro"
    ){

        if(
            document.body
            .classList
            .contains("light")
        ){

            toggleTheme();

        }


        return `
<span class="command-highlight">
Modo escuro ativado.
</span>
`;

    }


    /* -----------------------------------------------
       LIGHT THEME
       ----------------------------------------------- */

    if(
        command==="tema claro" ||
        command==="modo claro"
    ){

        if(
            !document.body
            .classList
            .contains("light")
        ){

            toggleTheme();

        }


        return `
<span class="command-highlight">
Modo claro ativado.
</span>
`;

    }


    /* -----------------------------------------------
       CLEAR HISTORY
       ----------------------------------------------- */

    if(
        command==="limpar histórico" ||
        command==="limpar historico"
    ){

        commandHistory=[];

        saveCommandData();

        renderCommandHistory();


        return `
<span class="command-highlight">
Histórico de comandos apagado.
</span>
`;

    }


    /* -----------------------------------------------
       JARVIS
       ----------------------------------------------- */

    if(
        command==="jarvis" ||
        command==="iniciar jarvis" ||
        command==="modo jarvis"
    ){

        return `
<div class="command-result">

<div class="command-result-title">
JARVIS CORE
</div>

<div class="command-result-line">

<span class="command-highlight">
Módulo preparado.
</span>

</div>

<div class="command-result-line">

A integração completa do JARVIS será
conectada nas próximas fases.

</div>

<div class="command-result-line">

PROJECT X Intelligence Core:
ONLINE

</div>

</div>
`;

    }


    /* -----------------------------------------------
       CUSTOM COMMANDS
       ----------------------------------------------- */

    const custom =
        customCommands.find(
            item =>
            item.command===
            command
        );


    if(custom){

        return escapeHTML(
            custom.response
        );

    }


    /* -----------------------------------------------
       UNKNOWN COMMAND
       ----------------------------------------------- */

    return `
<div class="command-result">

<div class="command-result-title">
COMANDO NÃO RECONHECIDO
</div>

<div class="command-result-line">

Não encontrei um comando chamado:

<span class="command-error">
${escapeHTML(raw)}
</span>

</div>

<div class="command-result-line">

Digite
<span class="command-highlight">
ajuda
</span>
para ver os comandos disponíveis.

</div>

</div>
`;

}


/* =====================================================
   NORMALIZE
   ===================================================== */

function normalizeCommand(text){

    return text
        .toLowerCase()
        .trim()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );

}


/* =====================================================
   PROJECT LIST
   ===================================================== */

function listProjects(list){

    if(!list.length){

        return `
<div class="command-result">

<div class="command-result-title">
PROJETOS
</div>

<div class="command-result-line">
Nenhum projeto encontrado.
</div>

</div>
`;

    }


    return `
<div class="command-result">

<div class="command-result-title">
PROJETOS — ${list.length}
</div>

${list.map(
    (p,index) =>
`
<div class="command-result-line">

<span class="command-highlight">
${index+1}.
${escapeHTML(p.name)}
</span>

— ${escapeHTML(p.status)}

— ${calculateProgress(p)}%

</div>
`
).join("")}

</div>
`;

}


/* =====================================================
   MESSAGE
   ===================================================== */

function addCommandMessage(
    text,
    type
){

    const output =
        document.getElementById(
            "commandOutput"
        );


    if(!output)
        return;


    const div =
        document.createElement(
            "div"
        );


    if(type==="user"){

        div.className=
            "user-message";


        div.innerHTML=`

            <div class="message-icon">
                R
            </div>

            <div>

                <strong>
                    RIOS
                </strong>

                <p>
                    ${escapeHTML(text)}
                </p>

            </div>

        `;

    }else{

        div.className=
            "jarvis-message";


        div.innerHTML=`

            <div class="message-icon">
                X
            </div>

            <div>

                <strong>
                    PROJECT X
                </strong>

                <p>
                    ${text}
                </p>

            </div>

        `;

    }


    output.appendChild(
        div
    );


    output.scrollTop =
        output.scrollHeight;

}


/* =====================================================
   COMMAND HISTORY
   ===================================================== */

function saveCommandHistory(
    command
){

    commandHistory.unshift({

        command,

        date:
            new Date()
            .toLocaleString(
                "pt-BR"
            )

    });


    commandHistory =
        commandHistory.slice(
            0,
            50
        );


    saveCommandData();

    renderCommandHistory();

}


/* =====================================================
   RENDER HISTORY
   ===================================================== */

function renderCommandHistory(){

    const box =
        document.getElementById(
            "commandHistory"
        );


    if(!box)
        return;


    box.innerHTML="";


    const counter =
        document.getElementById(
            "commandHistoryCount"
        );


    if(counter){

        counter.textContent =
            commandHistory.length+
            (
                commandHistory.length===1
                ?
                " comando"
                :
                " comandos"
            );

    }


    if(!commandHistory.length){

        box.innerHTML=`

            <p style="
                color:var(--muted);
                font-size:10px;
            ">
                Nenhum comando executado.
            </p>

        `;

        return;

    }


    commandHistory
    .slice(0,12)
    .forEach(item=>{

        const div =
            document.createElement(
                "div"
            );


        div.className=
            "command-history-item";


        div.innerHTML=`

            <span
                class="command-history-text"
            >
                &gt; ${escapeHTML(
                    item.command
                )}
            </span>

            <span
                class="command-history-date"
            >
                ${escapeHTML(
                    item.date
                )}
            </span>

        `;


        div.onclick=()=>{

            const input =
                document.getElementById(
                    "commandInput"
                );


            if(input){

                input.value =
                    item.command;

                input.focus();

            }

        };


        box.appendChild(
            div
        );

    });

}


/* =====================================================
   CLEAR HISTORY
   ===================================================== */

function clearCommandHistory(){

    if(!commandHistory.length)
        return;


    if(
        !confirm(
            "Limpar todo o histórico de comandos?"
        )
    )
        return;


    commandHistory=[];

    saveCommandData();

    renderCommandHistory();

}


/* =====================================================
   CUSTOM COMMAND CREATOR
   ===================================================== */

function createCustomCommand(){

    const command =
        prompt(
            "Nome do novo comando:"
        );


    if(!command)
        return;


    const response =
        prompt(
            "Resposta do comando:"
        );


    if(response===null)
        return;


    const normalized =
        normalizeCommand(
            command
        );


    customCommands =
        customCommands.filter(
            item =>
            item.command!==
            normalized
        );


    customCommands.push({

        command:
            normalized,

        response:
            response

    });


    saveCommandData();


    addCommandMessage(
        `
<div class="command-result">

<div class="command-result-title">
COMANDO PERSONALIZADO
</div>

<div class="command-result-line">

Comando
<span class="command-highlight">
${escapeHTML(command)}
</span>
criado.

</div>

</div>
`,
        "system"
    );

}


/* =====================================================
   INTELLIGENCE INITIALIZATION
   ===================================================== */

function initializeIntelligence(){

    renderCommandHistory();

}


/* =====================================================
   START
   ===================================================== */

initializeIntelligence();

</script>
